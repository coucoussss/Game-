<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sans Filet</title>
    <style>
      :root {
        --paper: #ece5cf;
        --ink: #1d1912;
        --accent: #c0392b;
        --gold: #d8b24a;
        --intel: #6fcf97;
        --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --serif: Georgia, 'Times New Roman', serif;
      }
      * { box-sizing: border-box; }
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; color: #eee; font-family: var(--ui); }
      #game, #hud { position: fixed; inset: 0; }
      #hud { pointer-events: none; user-select: none; }
      .hud-frame { position: absolute; inset: 0; }
      .hud-status { position: absolute; top: 14px; left: 16px; text-shadow: 0 1px 3px #000, 0 0 10px #0008; }
      .hud-status .clock { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
      .hud-status .money { margin-top: 3px; font-size: 16px; }
      .hud-status .clean { color: #9be29b; font-weight: 600; }
      .hud-status .dirty { color: #e8b75a; }
      .hud-status .dirty small { color: #b8a27a; }
      .hud-status .debt { font-size: 12px; color: #d9a0a0; margin-top: 2px; letter-spacing: 0.3px; }
      .hud-objective { position: absolute; top: 88px; left: 16px; max-width: min(420px, 70vw); font-size: 13px; line-height: 1.4; color: #e8e0c8;
        padding: 6px 10px; background: linear-gradient(90deg, #000a, #0000); border-left: 3px solid var(--gold); text-shadow: 0 1px 2px #000; }
      .hud-heat { position: absolute; top: 14px; right: 16px; font-size: 13px; text-shadow: 0 1px 3px #000; display: flex; align-items: center; gap: 8px; }
      .hud-heat .bar, .vital .bar { display: inline-block; width: 120px; height: 8px; background: #0009; border: 1px solid #fff3; }
      .hud-heat .bar span { display: block; height: 100%; background: linear-gradient(90deg, #e8b75a, #e0452b); }
      .hud-heat b { color: #ff6b5a; letter-spacing: 1px; }
      .hud-alert { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); padding: 7px 16px; border-radius: 3px; font-weight: 700;
        letter-spacing: 1.5px; opacity: 0; transition: opacity 0.3s; background: #000b; font-size: 14px; white-space: nowrap; }
      .hud-alert.on { opacity: 1; }
      .hud-alert.danger { background: #a3131399; animation: blink 0.8s infinite; }
      @keyframes blink { 50% { opacity: 0.55; } }
      .hud-cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --s: 6px; }
      .hud-cross i { position: absolute; background: #fffd; box-shadow: 0 0 2px #000; transition: transform 0.08s; }
      .hud-cross .c-t, .hud-cross .c-b { width: 2px; height: 7px; left: -1px; }
      .hud-cross .c-l, .hud-cross .c-r { width: 7px; height: 2px; top: -1px; }
      .hud-cross .c-t { top: calc(-7px - var(--s)); } .hud-cross .c-b { top: var(--s); }
      .hud-cross .c-l { left: calc(-7px - var(--s)); } .hud-cross .c-r { left: var(--s); }
      .hud-cross:not(.armed) .c-t, .hud-cross:not(.armed) .c-b, .hud-cross:not(.armed) .c-l, .hud-cross:not(.armed) .c-r { width: 4px; height: 4px; border-radius: 50%; left: -2px; top: -2px; }
      .hud-cross:not(.armed) i:not(.c-t) { display: none; }
      .hud-cross.threat i { background: var(--accent); }
      .hud-hit { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: 0; transition: opacity 0.1s;
        background: linear-gradient(45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%), linear-gradient(-45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%);
        -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); mask: radial-gradient(circle, transparent 5px, #000 6px); }
      .hud-look { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; display: none;
        -webkit-mask: radial-gradient(circle, transparent 13px, #000 14px); mask: radial-gradient(circle, transparent 13px, #000 14px); }
      .hud-prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); font-size: 16px; text-shadow: 0 1px 3px #000, 0 0 10px #000; white-space: nowrap; }
      .hud-progress { position: absolute; left: 50%; top: 63%; width: 220px; height: 6px; margin-left: -110px; background: #0009; border: 1px solid #fff5; display: none; }
      .hud-progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #e8b75a, #f2d27a); }
      .hud-slots { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 70vw; }
      .slot { padding: 6px 10px; background: #000a; border: 1px solid #fff2; border-radius: 3px; font-size: 13px; }
      .slot b { color: #999; margin-right: 4px; }
      .slot.held { border-color: var(--gold); background: #3a2f0dcc; }
      .slot.worn i { color: #9be29b; font-style: normal; font-size: 11px; }
      .slot.gear { color: #bbb; font-style: italic; }
      .slot.empty { color: #999; }
      .hud-vitals { position: absolute; bottom: 18px; left: 16px; display: flex; flex-direction: column; gap: 6px; text-shadow: 0 1px 2px #000; }
      .vital { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1px; color: #ccc; }
      .vital label { width: 58px; }
      .vital .bar { width: 160px; height: 10px; }
      .vital.hp .bar span { display: block; height: 100%; background: linear-gradient(90deg, #9b2a20, #e05a40); }
      .vital.armor .bar span { display: block; height: 100%; background: linear-gradient(90deg, #4a6a8a, #9ab8d8); }
      .vital.armor.off { opacity: 0.4; }
      .hud-vitals.low .hp .bar { animation: blink 0.6s infinite; }
      .hud-ammo { position: absolute; bottom: 18px; right: 20px; font-size: 18px; text-shadow: 0 1px 3px #000; display: none; color: #ddd; }
      .hud-ammo b { font-size: 32px; color: #fff; }
      .hud-ammo small { color: #e8b75a; }
      .hud-toasts { position: absolute; top: 140px; left: 16px; width: min(440px, 80vw); display: flex; flex-direction: column; gap: 6px; }
      .toast { padding: 7px 10px; background: #000c; border-left: 3px solid #aaa; font-size: 13px; line-height: 1.38; transition: opacity 1s; }
      .toast-intel { border-color: var(--intel); }
      .toast-money { border-color: #e8b75a; color: #f2d79a; }
      .toast-danger { border-color: var(--accent); color: #ffb3a8; font-weight: 700; }
      .toast.fade { opacity: 0; }
      .hud-vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, #a0000088 80%, #600000cc 100%); }
      .hud-vignette.armor { background: radial-gradient(ellipse at center, transparent 50%, #6a7a8a66 85%, #2a3a4aaa 100%); }
      .hud-fade { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: #000; }
      .hud-panel { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000a; pointer-events: auto; padding: 16px; }
      .hud-panel.title { background: linear-gradient(180deg, #0008 0%, #0002 40%, #000a 100%); }
      .card, .title-card { background: var(--paper); color: var(--ink); max-width: 680px; width: 100%; max-height: 94vh; overflow: auto; padding: 24px 28px; border-radius: 3px; box-shadow: 0 10px 50px #000; }
      .card.wide { max-width: 1180px; }
      .title-card { background: #0d0f14e8; color: #eee; border: 1px solid #fff2; max-width: 760px; }
      .title-card h1 { font-family: var(--serif); margin: 0; font-size: clamp(40px, 8vw, 76px); letter-spacing: 10px; color: #f2ead2; text-shadow: 0 4px 20px #000; }
      .title-card .tag { font-family: var(--serif); font-style: italic; color: var(--gold); margin: 4px 0 12px; font-size: 18px; }
      .title-card .sub { color: #bbb; }
      .title-card table.keys td { border-color: #fff1; color: #ccc; }
      .card h2 { margin: 0 0 10px; font-family: var(--serif); font-size: 28px; }
      .card h3 { margin: 16px 0 6px; font-size: 15px; }
      .card h3 small { font-weight: 400; color: #7a705a; }
      .card .ok, .card h2.ok { color: #2f7a4a; }
      .card .ko, .card h2.ko { color: var(--accent); }
      .card .sub { font-style: italic; color: #5a5040; }
      .card .kicker { margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; color: #7a705a; }
      .menu { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
      button { font: inherit; padding: 9px 18px; background: var(--ink); color: var(--paper); border: 0; border-radius: 2px; cursor: pointer; letter-spacing: 0.3px; }
      .title-card button { background: var(--gold); color: #1a1408; font-weight: 700; padding: 11px 26px; }
      button.ghost { background: transparent; color: inherit; border: 1px solid currentColor; }
      button:disabled { opacity: 0.35; cursor: default; }
      button:not(:disabled):hover { filter: brightness(1.15); }
      .card .msg { font-weight: 700; color: #2a4a7a; }
      .options { display: flex; gap: 24px; flex-wrap: wrap; margin: 10px 0; }
      .options label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
      table.keys { width: 100%; border-collapse: collapse; margin: 14px 0 4px; font-size: 13px; }
      table.keys td { padding: 5px 6px; border-bottom: 1px solid #0001; }
      table.keys td:nth-child(odd) { font-weight: 700; white-space: nowrap; }
      .hint { font-size: 12px; opacity: 0.7; margin: 6px 0 0; }
      .wallet { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; font-size: 14px; }
      .wallet b { display: block; font-size: 18px; }
      .shop-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
      table.shop { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
      table.shop td { padding: 7px 6px; border-bottom: 1px solid #0002; vertical-align: middle; font-size: 14px; }
      table.shop tr.owned { opacity: 0.55; }
      table.shop tr.lockedrow { opacity: 0.6; }
      table.shop .locked { color: #7a705a; font-size: 12px; }
      table.shop .price { font-weight: 700; white-space: nowrap; text-align: right; }
      .notebook canvas { width: 100%; height: auto; border: 1px solid #0003; display: block; }
      .nb-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 20px; margin: 6px 0 14px; }
      .nb-cols ul { margin: 0; padding: 0; list-style: none; font-size: 13px; }
      .nb-cols li { margin-bottom: 7px; display: flex; gap: 8px; line-height: 1.35; }
      .nb-cols li.empty { color: #7a705a; font-style: italic; }
      .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 3px; border: 1px solid #0006; }
      .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
      .facts div { background: #0000000d; padding: 8px; border-radius: 2px; }
      .facts small { display: block; color: #7a705a; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
      .facts b { font-size: 18px; }
      @media (max-width: 640px) { .facts { grid-template-columns: repeat(2, 1fr); } .hud-objective { top: 96px; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
