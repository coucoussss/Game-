<title>Jugement Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
  /* Un seul monde visuel : l'écran noir d'un combat 8-bit. Boutons tactiles aux couleurs des boutons de combat. */
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --edge: #ff7f27;
    --hi: #ffff00;
    --pad: #0d0d0d;
    --font-ui: 'Silkscreen', 'Courier New', monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    box-sizing: border-box;
  }
  canvas { display: block; background: var(--bg); image-rendering: pixelated; outline: none; }
  #touch {
    width: 100%; max-width: 640px; height: 180px; box-sizing: border-box; padding-inline: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0;
  }
  #touch[hidden] { display: none; }
  #dpad { position: relative; width: 156px; height: 156px; border-radius: 50%; background: var(--pad); border: 2px solid #2a2a2a; touch-action: none; }
  #dpad span { position: absolute; background: #222; border: 2px solid #444; box-sizing: border-box; }
  #dpad .h { left: 14px; right: 14px; top: 56px; height: 44px; border-radius: 6px; }
  #dpad .v { top: 14px; bottom: 14px; left: 56px; width: 44px; border-radius: 6px; }
  #dpad.on-up .v, #dpad.on-down .v, #dpad.on-left .h, #dpad.on-right .h { border-color: var(--hi); }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .row { display: flex; gap: 14px; align-items: center; }
  .tbtn {
    width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--edge); background: var(--bg); color: var(--edge);
    font: 700 24px var(--font-ui); touch-action: none; padding: 0;
  }
  .tbtn.small { width: 44px; height: 44px; font-size: 13px; border-width: 2px; }
  .tbtn.active { border-color: var(--hi); color: var(--hi); }
  .tbtn:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
  @media (orientation: landscape) {
    #touch { position: absolute; left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom, 0px)); max-width: none; height: auto; pointer-events: none; }
    #touch > * { pointer-events: auto; opacity: 0.6; }
  }
</style>
<div id="app">
  <canvas id="game" aria-label="Jugement Final, combat contre Sans"></canvas>
  <div id="touch" hidden>
    <div id="dpad" aria-label="Croix directionnelle"><span class="h"></span><span class="v"></span></div>
    <div class="side">
      <div class="row">
        <button class="tbtn small" data-k="mute" aria-label="Couper le son">SON</button>
        <button class="tbtn small" data-k="esc" aria-label="Pause">II</button>
      </div>
      <div class="row">
        <button class="tbtn" data-k="x" aria-label="Retour">X</button>
        <button class="tbtn" data-k="z" aria-label="Valider">Z</button>
      </div>
    </div>
  </div>
</div>
<script src="audio.js"></script>
<script src="game.js"></script>
